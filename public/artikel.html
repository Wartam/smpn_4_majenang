<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SMP Negeri 4 Majenang" />
    <link rel="icon" href="/logo-smpn4-transparan.png" type="image/png" />
    <title>Artikel — SMPN 4 Majenang</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="/styles.css" />
    <style>
      .article-page {
        min-height: 100vh;
        background: #fff;
      }

      .article-page .brand-logo {
        width: 42px;
        height: 42px;
        object-fit: contain;
        display: block;
      }

      .article-header {
        background: var(--blue);
        color: #fff;
        padding: 130px 0 70px;
      }

      .article-header .category {
        color: var(--yellow);
      }

      .article-header h1 {
        max-width: 900px;
        margin: 20px 0;
        font-size: clamp(2.5rem, 5vw, 5rem);
      }

      .article-meta {
        color: #c9e1f8;
        font-size: .82rem;
      }

      .article-body {
        max-width: 800px;
        margin: auto;
        padding: 70px 0 110px;
      }

      .article-image {
        width: 100%;
        max-height: 520px;
        object-fit: cover;
        border-radius: 8px;
        margin-bottom: 45px;
      }

      .article-content {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.9;
      }

      .article-content p {
        margin-bottom: 1.4em;
      }

      .article-content ul,
      .article-content ol {
        margin: 0 0 1.4em 1.5em;
        padding-left: 1.2em;
      }

      .article-content li {
        margin-bottom: 0.45em;
        padding-left: 0.25em;
      }

      .article-excerpt {
        color: var(--ink);
        font-size: 1.25rem;
        line-height: 1.7;
        font-weight: 500;
        margin-bottom: 35px;
        padding-left: 20px;
        border-left: 4px solid var(--yellow);
      }

      .article-back {
        display: inline-flex;
        color: var(--blue);
        text-decoration: none;
        font-weight: 700;
        font-size: .85rem;
        margin-bottom: 35px;
      }

      .article-empty {
        padding: 40px 0;
        color: var(--muted);
      }

      @media (max-width: 800px) {
        .article-header {
          padding: 105px 0 55px;
        }

        .article-body {
          padding: 45px 0 75px;
        }

        .article-header h1 {
          font-size: 2.7rem;
        }
      }
    </style>
  </head>

  <body class="article-page">
    <header class="site-header inner-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">
          <img class="brand-logo" src="/logo-smpn4-transparan.png" alt="Logo SMP Negeri 4 Majenang" fetchpriority="high" decoding="async" />
          <span>
            <strong>SMPN 4 Majenang</strong>
          </span>
        </a>

        <nav class="main-nav">
          <a href="/">Beranda</a>
          <a href="/#profil">Profil</a>
          <a href="/#berita">Berita</a>
          <a href="/#blog">Blog</a>
        </nav>

        <button class="menu-toggle" type="button" aria-label="Buka menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </header>

    <main>
      <section class="article-header">
        <div class="container">
          <div id="article-category" class="category">MEMUAT...</div>
          <h1 id="article-title">Memuat artikel...</h1>
          <div id="article-meta" class="article-meta"></div>
        </div>
      </section>

      <section class="article-body container">
        <a class="article-back" href="/#berita">← Kembali ke berita</a>

        <img id="article-image" class="article-image" alt="" hidden />

        <div id="article-excerpt" class="article-excerpt" hidden></div>

        <article id="article-content" class="article-content">
          Memuat isi artikel...
        </article>
      </section>
    </main>

    <footer>
      <div class="container footer-wrap">
        <a class="brand" href="/">
          <img class="brand-logo" src="/logo-smpn4-transparan.png" alt="Logo SMP Negeri 4 Majenang" loading="lazy" decoding="async" />
          <span>
            <strong>SMPN 4 Majenang</strong>
          </span>
        </a>

        <p>
          © <span class="current-year">2026</span> SMP Negeri 4 Majenang<br />
          Bertaqwa • Cerdas • Terampil • Cinta Lingkungan
        </p>
      </div>
    </footer>

    <script src="/artikel.js"></script>
  </body>
</html>
